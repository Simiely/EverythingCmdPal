<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>链接库编辑器</title>
<style>
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#fbfbfd; --sidebar:#f2f2f7;
  --text:#1d1d1f; --text-2:#6e6e73; --text-3:#8e8e93;
  --line:rgba(0,0,0,.09); --line-strong:rgba(0,0,0,.16);
  --accent:#007aff; --accent-soft:rgba(0,122,255,.12);
  --danger:#ff3b30; --danger-soft:rgba(255,59,48,.10);
  --ok:#34c759; --warn:#ff9f0a;
  --radius-s:8px; --radius-m:12px; --radius-l:16px;
  --shadow-1:0 1px 2px rgba(0,0,0,.05);
  --shadow-2:0 10px 30px rgba(0,0,0,.10),0 1px 3px rgba(0,0,0,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1e; --surface:#2c2c2e; --surface-2:#242426; --sidebar:#232325;
    --text:#f5f5f7; --text-2:#aeaeb2; --text-3:#8e8e93;
    --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.18);
    --accent:#0a84ff; --accent-soft:rgba(10,132,255,.18);
    --danger:#ff453a; --danger-soft:rgba(255,69,58,.16);
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 14px 40px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}

/* 顶部工具栏 */
.toolbar{
  height:56px;display:flex;align-items:center;gap:12px;padding:0 18px;
  background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.2px}
.brand-mark{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(160deg,#0a84ff,#5ac8fa);color:#fff;font-size:13px;font-weight:700;
}
.brand small{color:var(--text-3);font-weight:400;font-size:12px}
.search{
  flex:1;max-width:420px;margin-left:auto;display:flex;align-items:center;gap:8px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:34px;
  transition:border-color .15s,box-shadow .15s;
}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{border:0;background:transparent;outline:0;width:100%;height:100%}
.search .glyph{color:var(--text-3)}
.btn{
  height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--text);font-weight:500;
  display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s,transform .06s;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--accent-soft);color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.sm{height:28px;padding:0 10px;border-radius:7px;font-size:12px}

/* 主体三栏 */
.workspace{flex:1;min-height:0;display:grid;grid-template-columns:248px minmax(0,1fr) 332px}
.sidebar{
  background:var(--sidebar);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.side-head{
  height:44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px 0 16px;color:var(--text-2);font-weight:600;font-size:12px;letter-spacing:.4px;text-transform:uppercase;
}
.side-head button{
  width:26px;height:26px;border-radius:7px;border:0;background:transparent;color:var(--text-2);
  display:grid;place-items:center;font-size:16px;line-height:1;
}
.side-head button:hover{background:rgba(120,120,128,.14);color:var(--text)}
.tree{flex:1;overflow:auto;padding:4px 8px 12px}
.tree-row{
  display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:8px;
  color:var(--text-2);cursor:default;position:relative;
}
.tree-row.root{font-weight:600;color:var(--text);height:36px}
.tree-row.toplevel{font-weight:600}
.tree-row.child{padding-left:18px}
.tree-row:hover{background:rgba(120,120,128,.10);color:var(--text)}
.tree-row.selected{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tree-row .glyph{width:16px;text-align:center;font-size:13px}
.tree-row .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-row .count{color:var(--text-3);font-size:11px;font-variant-numeric:tabular-nums}
.tree-row .tools{display:none;gap:2px;margin-left:4px}
.tree-row:hover .tools,.tree-row.selected .tools{display:flex}
.tiny-btn{
  width:22px;height:22px;border:0;border-radius:6px;background:transparent;color:var(--text-3);
  display:grid;place-items:center;font-size:11px;line-height:1;
}
.tiny-btn:hover{background:rgba(120,120,128,.18);color:var(--text)}
.tiny-btn:disabled{opacity:.25;pointer-events:none}
.tree-row.pinned .count::before{content:"· ";}
.side-note{padding:10px 16px 14px;color:var(--text-3);font-size:11px;border-top:1px solid var(--line)}

/* 中间内容区 */
.content{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.content-head{
  min-height:50px;display:flex;flex-direction:column;justify-content:center;gap:6px;
  padding:8px 20px;background:var(--surface);border-bottom:1px solid var(--line);
}
.content-title{display:flex;align-items:baseline;gap:10px}
.content-title h1{font-size:16px;font-weight:650;margin:0;letter-spacing:-.2px}
.content-title .meta{color:var(--text-3);font-size:12px}
.bulk{
  display:none;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;
  background:var(--accent-soft);color:var(--accent);font-weight:500;
}
.bulk.on{display:flex}
.bulk select{
  height:26px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);padding:0 6px;
}
.list{flex:1;overflow:auto;padding:12px 14px 24px}
.item{
  display:grid;grid-template-columns:22px 38px minmax(0,1fr) auto;align-items:center;gap:10px;
  padding:9px 12px;border-radius:10px;background:transparent;border:1px solid transparent;
  transition:background .12s,border-color .12s,box-shadow .12s;
}
.item:hover{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow-1)}
.item.selected{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.item input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent)}
.icon{
  width:38px;height:38px;border-radius:9px;display:grid;place-items:center;
  background:rgba(120,120,128,.12);color:var(--text);font-size:17px;font-weight:600;
  overflow:hidden;border:1px solid var(--line);
}
.icon img{width:100%;height:100%;object-fit:contain}
.item-main{min-width:0}
.item-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{color:var(--text-3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.chip{
  padding:0 7px;height:18px;border-radius:9px;background:rgba(120,120,128,.12);
  color:var(--text-2);font-size:10px;display:inline-flex;align-items:center;
}
.item-actions{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.item:hover .item-actions,.item.selected .item-actions{opacity:1}
.empty{
  flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-3);
}
.empty.on{display:flex}
.empty-glyph{
  width:64px;height:64px;border-radius:16px;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line);font-size:26px;color:var(--text-3);box-shadow:var(--shadow-1);
}
.empty h2{margin:0;font-size:14px;color:var(--text-2);font-weight:600}
.empty p{margin:0;font-size:12px;max-width:280px;text-align:center}
.statusbar{
  height:30px;display:flex;align-items:center;gap:10px;padding:0 16px;border-top:1px solid var(--line);
  background:var(--surface);color:var(--text-3);font-size:11px;
}
.statusbar .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.statusbar.dirty .dot{background:var(--warn)}
.statusbar .spacer{flex:1}

/* 右侧检查器 */
.inspector{
  background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
}
.insp-head{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line)}
.insp-head h2{font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--text-2);margin:0;font-weight:600}
.insp-body{flex:1;overflow:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px}
.insp-empty{color:var(--text-3);font-size:12px;text-align:center;margin-top:40px;line-height:1.7}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;color:var(--text-2);font-weight:600}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2);
  padding:7px 9px;outline:0;transition:border-color .15s,box-shadow .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{resize:vertical;min-height:58px}
.field .hint{font-size:10px;color:var(--text-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.preview .icon{width:46px;height:46px;font-size:20px}
.preview .pv-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview .pv-sub{color:var(--text-3);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insp-actions{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.insp-actions .btn{flex:1;justify-content:center}

/* 弹窗与 Toast */
#modal-root{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.28);z-index:50;backdrop-filter:blur(3px)}
#modal-root.on{display:flex}
.modal{
  width:380px;background:var(--surface);border-radius:var(--radius-l);box-shadow:var(--shadow-2);
  border:1px solid var(--line);overflow:hidden;animation:pop .18s ease-out;
}
@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:scale(1);opacity:1}}
.modal h3{margin:0;padding:16px 18px 4px;font-size:15px;font-weight:650}
.modal p{margin:0;padding:0 18px 6px;color:var(--text-2);font-size:12px;line-height:1.6}
.modal .m-body{padding:10px 18px 6px}
.modal .m-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px}
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);opacity:0;pointer-events:none;
  background:rgba(30,30,32,.92);color:#fff;padding:9px 16px;border-radius:10px;font-size:12px;
  transition:opacity .2s,transform .2s;z-index:60;box-shadow:var(--shadow-2);
}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:1100px){.workspace{grid-template-columns:220px minmax(0,1fr)}.inspector{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="toolbar">
    <div class="brand"><span class="brand-mark">链</span><span>链接库 <small>编辑器</small></span></div>
    <div class="search">
      <span class="glyph">⌕</span>
      <input id="search" type="search" placeholder="搜索标题、网址、标签或文件夹…" autocomplete="off">
    </div>
    <button class="btn" id="btn-import-json" title="从 JSON 导入（会替换当前列表，保存后生效）">导入 JSON</button>
    <button class="btn" id="btn-export-json" title="导出全部条目与文件夹为 JSON">导出 JSON</button>
    <button class="btn primary" id="btn-save" disabled>保存到插件</button>
  </header>

  <main class="workspace">
    <aside class="sidebar">
      <div class="side-head"><span>文件夹</span><button id="btn-new-folder" title="新建文件夹">＋</button></div>
      <div class="tree" id="tree"></div>
      <div class="side-note">「常用」固定在「网页链接」内第一位；「网页链接」不可删除；顶层其他文件夹可改名、删除。</div>
    </aside>

    <section class="content">
      <div class="content-head">
        <div class="content-title"><h1 id="folder-title">网页链接</h1><span class="meta" id="folder-meta"></span><span style="flex:1"></span><button class="btn sm" id="btn-new-item">＋ 新建条目</button></div>
        <div class="bulk" id="bulk">
          <span id="bulk-count"></span>
          <select id="bulk-target" title="批量移动到文件夹"></select>
          <button class="btn sm" id="bulk-move">移动</button>
          <button class="btn sm" id="bulk-common">设为常用</button>
          <button class="btn sm ghost" id="bulk-clear">取消选择</button>
        </div>
      </div>
      <div class="list" id="list"></div>
      <div class="empty" id="empty">
        <div class="empty-glyph">◌</div>
        <h2>这个文件夹还没有条目</h2>
        <p>从其他文件夹移动条目进来，或新建一条链接。</p>
        <button class="btn" id="btn-new-item-empty">新建条目</button>
      </div>
      <div class="statusbar" id="status"><span class="dot"></span><span id="status-text"></span><span class="spacer"></span><span id="status-right"></span></div>
    </section>

    <aside class="inspector">
      <div class="insp-head"><h2>编辑详情</h2><button class="btn sm ghost" id="btn-delete-item">删除</button></div>
      <div class="insp-body" id="insp-body"></div>
      <div class="insp-actions">
        <button class="btn" id="btn-apply" disabled>应用到列表</button>
      </div>
    </aside>
  </main>
</div>

<div id="modal-root"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
"use strict";

/* ---------- 常量与状态 ---------- */
const ROOT = "网页链接";
const COMMON = ROOT + "/常用";
const ICON_KINDS = ["auto","block","transparent","emoji"];
const state = {
  items: [], folders: [ROOT, COMMON], selectedFolder: ROOT, selectedIds: new Set(),
  editingId: null, dirty: false, query: "", saving: false, token: "", folderOrderDirty: false,
  bulkTarget: "", newIdSeq: 0,
};

/* ---------- 小工具 ---------- */
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
function leaf(path){ const i = path.lastIndexOf("/"); return i < 0 ? path : path.slice(i+1); }
function isUnder(path, ancestor){ return path === ancestor || path.startsWith(ancestor + "/"); }
function folderName(path){ return leaf(path); }
function normalizeFolder(raw){
  const s = String(raw || "").replace(/\r/g," ").replace(/\n/g," ").trim();
  if (!s) return "";
  return s.split("/").map(x => x.trim()).filter(Boolean).join("/");
}
function folderValidationError(folder){
  const name = normalizeFolder(folder);
  if (!name) return "文件夹名称不能为空";
  if (name.length > 256) return "文件夹总长度不能超过 256 个字符";
  if (name.split("/").some(part => part.length > 64)) return "文件夹每段名称不能超过 64 个字符";
  if (/[\u0000-\u001f\u007f]/.test(name)) return "文件夹名不能包含控制字符";
  return "";
}
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2200);
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ---------- JSON ---------- */
function splitList(value){
  // 编辑器内部用 "|" 分隔；插件 JSON 用字符串数组，两种都能读。
  if (Array.isArray(value)) return value.map(x => String(x == null ? "" : x).trim()).filter(Boolean);
  return String(value == null ? "" : value).split("|").map(x => x.trim()).filter(Boolean);
}
function pickField(obj, keys){
  // 兼容编辑器字段（type/alias/color/iconSrc）与插件字段（kind/aliases/iconColor/iconSource），键名忽略大小写。
  const lower = {};
  Object.keys(obj).forEach(key => { lower[key.toLowerCase()] = obj[key]; });
  for (const key of keys){
    const value = lower[key.toLowerCase()];
    if (value !== undefined && value !== null) return value;
  }
  return undefined;
}
function exportJson(){
  const payload = {
    schemaVersion: 3,
    updatedAt: new Date().toISOString(),
    folders: state.folders.slice(),
    items: state.items.map(it => ({
      id: it.id || "",
      kind: it.type,
      target: it.target,
      title: it.title,
      aliases: splitList(it.alias),
      tags: splitList(it.tags),
      iconKind: it.iconKind || "auto",
      iconColor: it.color || "",
      iconEmoji: it.emoji || "",
      folder: it.folder || "",
      iconSource: it.iconSrc || "",
    })),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json;charset=utf-8"});
  const a = el("a"); a.href = URL.createObjectURL(blob); a.download = "links.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("已导出 " + payload.items.length + " 条与 " + payload.folders.length + " 个文件夹");
}
function importJsonFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(String(reader.result || ""));
      const rawItems = Array.isArray(data) ? data : (data && Array.isArray(data.items) ? data.items : null);
      if (!rawItems){ throw new Error("缺少 items 数组"); }

      // 文件夹按文件中的顺序保留，缺失的父级自动补全；同名（忽略大小写）只留第一个。
      const folderList = [];
      const addFolderChain = (raw) => {
        const name = normalizeFolder(raw);
        if (!name) return true;
        if (folderValidationError(name)) return false;
        const parts = name.split("/"); let acc = "";
        for (const part of parts){
          acc = acc ? acc + "/" + part : part;
          if (!folderList.some(f => f.toLowerCase() === acc.toLowerCase())) folderList.push(acc);
        }
        return true;
      };

      let badFolders = 0;
      if (!Array.isArray(data) && Array.isArray(data.folders)){
        data.folders.forEach(raw => { if (!addFolderChain(raw)) badFolders++; });
      }

      const items = []; const seen = new Set();
      let skipped = 0; let duplicated = 0;
      rawItems.forEach(raw => {
        if (!raw || typeof raw !== "object"){ skipped++; return; }
        const type = String(pickField(raw, ["kind","type"]) || "url").trim().toLowerCase();
        const target = String(pickField(raw, ["target"]) || "").trim();
        if (!["url","file","folder"].includes(type) || !target){ skipped++; return; }
        const folder = normalizeFolder(pickField(raw, ["folder"]) || "");
        if (folder && !addFolderChain(folder)){ skipped++; return; }
        const key = type + "\n" + target;
        if (seen.has(key)){ duplicated++; return; }
        seen.add(key);
        const icon = String(pickField(raw, ["iconKind","icon"]) || "").trim().toLowerCase();
        items.push({
          id: String(pickField(raw, ["id"]) || ""),
          type, target,
          title: String(pickField(raw, ["title"]) || "").trim() || target,
          alias: splitList(pickField(raw, ["aliases","alias"])).join("|"),
          tags: splitList(pickField(raw, ["tags","tag"])).join("|"),
          emoji: String(pickField(raw, ["iconEmoji","emoji"]) || "").trim(),
          color: String(pickField(raw, ["iconColor","color"]) || "").trim(),
          iconKind: ICON_KINDS.includes(icon) ? icon : "auto",
          folder,
          iconSrc: String(pickField(raw, ["iconSource","iconSrc"]) || "").trim(),
        });
      });

      if (!items.length){ throw new Error("没有可导入的条目" + (skipped ? `（跳过 ${skipped} 条非法）` : "")); }

      const rest = folderList.filter(f => {
        const lower = f.toLowerCase();
        return lower !== ROOT.toLowerCase() && lower !== COMMON.toLowerCase();
      });
      state.folders = [ROOT, COMMON, ...rest];
      state.items = items;
      state.selectedFolder = ROOT; state.selectedIds.clear(); state.editingId = null;
      state.dirty = true; renderAll();
      const notes = [];
      if (skipped) notes.push(`跳过 ${skipped} 条非法`);
      if (duplicated) notes.push(`忽略 ${duplicated} 条重复`);
      if (badFolders) notes.push(`跳过 ${badFolders} 个非法文件夹`);
      toast("已导入 " + items.length + " 条" + (notes.length ? `，${notes.join("、")}` : "") + "，记得点「保存到插件」");
    } catch (err){ toast("JSON 导入失败：" + err.message); }
  };
  reader.readAsText(file, "utf-8");
}

/* ---------- 数据 ---------- */
function ensureFolderChain(path){
  const norm = normalizeFolder(path);
  if (!norm) return;
  const parts = norm.split("/");
  let acc = "";
  for (const p of parts){
    acc = acc ? acc + "/" + p : p;
    if (!state.folders.includes(acc)) state.folders.push(acc);
  }
  if (!state.folders.includes(ROOT)) state.folders.unshift(ROOT);
  if (!state.folders.includes(COMMON)) state.folders.splice(1, 0, COMMON);
}
function rootChildren(){
  return state.folders.filter(f => f.startsWith(ROOT + "/") && !f.slice(ROOT.length+1).includes("/"));
}
function topFolders(){
  return state.folders.filter(f => !f.includes("/"));
}
function parentPath(path){
  const i = path.lastIndexOf("/");
  return i < 0 ? "" : path.slice(0, i);
}
function childFolders(parent){
  return state.folders.filter(f => parentPath(f) === parent);
}
function unsortedCount(){
  return state.items.filter(it => !it.folder).length;
}
function countInTree(path){
  return state.items.filter(it => isUnder(it.folder, path)).length;
}
function currentItems(){
  const base = state.selectedFolder === ROOT
    ? state.items.filter(it => isUnder(it.folder, ROOT))
    : state.selectedFolder === ""
      ? state.items.filter(it => !it.folder)
      : state.items.filter(it => it.folder === state.selectedFolder);
  const q = state.query.trim().toLowerCase();
  if (!q) return base;
  return base.filter(it => [it.title,it.target,it.alias,it.tags,it.folder,it.emoji]
    .some(v => String(v || "").toLowerCase().includes(q)));
}

/* ---------- 渲染：侧栏 ---------- */
function renderTree(){
  const tree = $("tree"); tree.textContent = "";

  // 「网页链接」外面的散项：folder 为空，不归属任何文件夹。
  const loose = el("div","tree-row toplevel" + (state.selectedFolder === "" ? " selected" : ""));
  loose.append(el("span","glyph","○"), el("span","name","未分类（网页链接 外）"), el("span","count",String(unsortedCount())));
  loose.onclick = () => { state.selectedFolder = ""; state.selectedIds.clear(); renderAll(); };
  tree.append(loose);

  const renderChildren = (parent, depth, rootBranch) => {
    childFolders(parent).forEach((path) => {
      const pinned = path === COMMON;
      const row = el("div","tree-row child" + (state.selectedFolder === path ? " selected" : ""));
      row.style.paddingLeft = (14 + (depth - 2) * 16) + "px";
      if (pinned) row.classList.add("pinned");
      row.append(el("span","glyph", pinned ? "★" : "·"));
      row.append(el("span","name", folderName(path)));
      row.append(el("span","count", String(countInTree(path))));

      const tools = el("div","tools");
      if (rootBranch && parent === ROOT && !pinned){
        const siblings = rootChildren();
        const idx = siblings.indexOf(path);
        const up = el("button","tiny-btn","↑"); up.title = "上移";
        up.disabled = idx === 1; up.onclick = (e) => { e.stopPropagation(); moveFolder(path,-1); };
        const down = el("button","tiny-btn","↓"); down.title = "下移";
        down.disabled = idx === siblings.length - 1;
        down.onclick = (e) => { e.stopPropagation(); moveFolder(path,1); };
        tools.append(up, down);
      }
      const rename = el("button","tiny-btn","✎"); rename.title = "重命名";
      rename.disabled = pinned;
      rename.onclick = (e) => { e.stopPropagation(); openRenameFolder(path); };
      const del = el("button","tiny-btn","⌫"); del.title = "删除";
      del.disabled = pinned;
      del.onclick = (e) => { e.stopPropagation(); openDeleteFolder(path); };
      tools.append(rename, del);
      row.append(tools);
      row.onclick = () => { state.selectedFolder = path; state.selectedIds.clear(); renderAll(); };
      tree.append(row);
      renderChildren(path, depth + 1, rootBranch);
    });
  };

  topFolders().forEach((top) => {
    const isRoot = top === ROOT;
    const topRow = el("div","tree-row toplevel" + (isRoot ? " root" : "") + (state.selectedFolder === top ? " selected" : ""));
    topRow.append(el("span","glyph", isRoot ? "▤" : "▸"));
    topRow.append(el("span","name", top));
    topRow.append(el("span","count", String(countInTree(top))));
    if (!isRoot){
      const tools = el("div","tools");
      const rename = el("button","tiny-btn","✎"); rename.title = "重命名";
      rename.onclick = (e) => { e.stopPropagation(); openRenameFolder(top); };
      const del = el("button","tiny-btn","⌫"); del.title = "删除";
      del.onclick = (e) => { e.stopPropagation(); openDeleteFolder(top); };
      tools.append(rename, del);
      topRow.append(tools);
    }
    topRow.onclick = () => { state.selectedFolder = top; state.selectedIds.clear(); renderAll(); };
    tree.append(topRow);
    renderChildren(top, 2, isRoot);
  });
}

/* ---------- 渲染：列表 ---------- */
function iconNode(item, cls){
  const box = el("div","icon" + (cls ? " " + cls : ""));
  const color = item.color && /^#[0-9a-f]{6}$/i.test(item.color) ? item.color : "";
  if (color) box.style.background = color;
  if (item.iconKind === "transparent") box.style.background = "transparent";
  if (item.emoji){ box.textContent = Array.from(item.emoji)[0]; if (!color) box.style.color = "var(--text)"; return box; }
  if (item.iconSrc){
    const img = el("img"); img.alt = ""; img.src = item.iconSrc;
    img.onerror = () => { img.remove(); box.textContent = initial(item); };
    box.append(img); return box;
  }
  box.textContent = initial(item);
  if (!color) box.style.background = "rgba(120,120,128,.12)";
  return box;
}
function initial(item){ return Array.from(item.title || "?")[0] || "?"; }

function renderList(){
  const list = $("list"); list.textContent = "";
  const items = currentItems();
  const title = state.query
    ? "搜索结果"
    : state.selectedFolder === ROOT
      ? ROOT
      : state.selectedFolder === ""
        ? "未分类（网页链接 外）"
        : folderName(state.selectedFolder);
  $("folder-title").textContent = title;
  const total = state.selectedFolder === ROOT
    ? countInTree(ROOT)
    : state.selectedFolder === ""
      ? unsortedCount()
      : state.items.filter(it => it.folder === state.selectedFolder).length;
  $("folder-meta").textContent = state.query
    ? items.length + " 条匹配 / 共 " + total + " 条"
    : state.selectedFolder === ROOT
      ? total + " 条（含所有子文件夹）"
      : total + " 条";

  const empty = $("empty"); empty.classList.toggle("on", items.length === 0);
  if (!items.length){
    const searching = state.query.trim().length > 0;
    empty.querySelector("h2").textContent = searching ? "没有匹配的条目" : "这个文件夹还没有条目";
    empty.querySelector("p").textContent = searching
      ? "换个关键词，或清空搜索框。"
      : "从其他文件夹移动条目进来，或新建一条链接。";
  }
  if (!items.length){ list.style.display = "none"; } else { list.style.display = ""; }

  items.forEach(item => {
    const row = el("div","item" + (state.editingId === item.id && item.id ? " selected" : ""));
    const cb = el("input"); cb.type = "checkbox"; cb.checked = item.id ? state.selectedIds.has(item.id) : false;
    cb.disabled = !item.id;
    cb.onchange = () => { if (cb.checked) state.selectedIds.add(item.id); else state.selectedIds.delete(item.id); renderBulk(); };
    // 勾选框不触发整行的「选中并重绘」：否则勾选后 renderAll 会把复选框重建，change 丢失，表现为勾不上。
    cb.onclick = (e) => { e.stopPropagation(); };
    row.append(cb, iconNode(item));

    const main = el("div","item-main");
    main.append(el("div","item-title", item.title || "(无标题)"));
    main.append(el("div","item-sub", (item.type === "url" ? item.target : item.type + " · " + item.target) || "—"));
    const chips = el("div","chips");
    if (item.folder && item.folder !== ROOT){
      chips.append(el("span","chip", folderName(item.folder)));
    }
    String(item.tags || "").split("|").filter(Boolean).slice(0,3).forEach(t => chips.append(el("span","chip", t)));
    if (item.emoji) chips.append(el("span","chip","图标 "+item.emoji));
    if (item.iconSrc && !item.emoji) chips.append(el("span","chip","图标 URL"));
    if (chips.childElementCount) main.append(chips);

    const acts = el("div","item-actions");
    const commonBtn = el("button","tiny-btn","★"); commonBtn.title = "设为常用";
    commonBtn.onclick = (e) => { e.stopPropagation(); setFolder(item, COMMON); };
    const editBtn = el("button","tiny-btn","✎"); editBtn.title = "编辑";
    editBtn.onclick = (e) => { e.stopPropagation(); selectItem(item.id); };
    acts.append(commonBtn, editBtn);
    row.append(main, acts);

    row.onclick = () => selectItem(item.id);
    list.append(row);
  });
  renderBulk();
}

function renderBulk(){
  const on = state.selectedIds.size > 0;
  $("bulk").classList.toggle("on", on);
  $("bulk-count").textContent = "已选 " + state.selectedIds.size + " 条";
  const sel = $("bulk-target"); sel.textContent = "";
  const none = el("option","","（未分类 / 网页链接 外）"); none.value = ""; sel.append(none);
  state.folders.forEach(path => { const o = el("option","",path); o.value = path; sel.append(o); });
  // 勾选变化会重建批量栏；保留用户已选的目标，避免每次勾选都退回「未分类」。
  const keep = state.bulkTarget === "" || state.folders.includes(state.bulkTarget) ? state.bulkTarget : "";
  sel.value = keep;
  state.bulkTarget = keep;
  sel.onchange = () => { state.bulkTarget = sel.value; };
}

/* ---------- 渲染：检查器 ---------- */
function renderInspector(){
  const body = $("insp-body"); body.textContent = "";
  const item = state.items.find(x => x.id === state.editingId);
  $("btn-apply").disabled = !item;
  $("btn-delete-item").disabled = !item;
  if (!item){
    const p = el("div","insp-empty","从左侧列表选择一条条目，或新建条目后在这里编辑。\n改动先应用到列表，再点右上角「保存到插件」。");
    p.style.whiteSpace = "pre-line"; body.append(p); return;

  const folderOptions = [["", "（未分类 / 网页链接 外）"], ...state.folders.map(p => [p, p])];
  if (item.folder && !folderOptions.some(([v]) => v === item.folder)) folderOptions.push([item.folder, item.folder]);

  alias.oninput = () => { item.alias = alias.value; state.dirty = true; renderStatus(); };

  const tagField = el("div","field"); tagField.append(el("label","","标签（| 分隔）"));
  const tags = el("input"); tags.value = item.tags || ""; tags.placeholder = "多个标签用 |";
  tags.oninput = () => { item.tags = tags.value; state.dirty = true; renderStatus(); };
  tagField.append(tags); g.append(tagField);

  const g2 = el("div","grid2");
  const emojiField = el("div","field"); emojiField.append(el("label","","文字图标 / emoji"));

  emoji.oninput = () => { item.emoji = emoji.value; state.dirty = true; renderStatus(); };
  emojiField.append(emoji); g2.append(emojiField);
  const colorField = el("div","field"); colorField.append(el("label","","图标底色"));
  const color = el("input"); color.value = item.color || ""; color.placeholder = "#RRGGBB";
  color.oninput = () => { item.color = color.value; state.dirty = true; renderStatus(); };
  colorField.append(color); g2.append(colorField);
  body.append(g2);

  const kind = mk("图标形态", "iconKind", { options: ICON_KINDS.map(k => [k, k]) });

/* ---------- 状态与保存 ---------- */
function renderStatus(){
  const bar = $("status");
  bar.classList.toggle("dirty", state.dirty);
  $("status-text").textContent = state.dirty ? "有未保存的修改" : "已与插件同步";
  $("status-right").textContent = state.items.length + " 条 · " + state.folders.length + " 个文件夹";
  $("btn-save").disabled = !state.dirty || state.saving;
}
function renderAll(){ renderTree(); renderList(); renderInspector(); renderStatus(); }

async function apiRequest(path, options){
  const headers = { "Accept":"application/json" };
  if (options && options.body) headers["Content-Type"] = "application/json";
  if (state.token) headers["X-CmdPalLinks-Token"] = state.token;
  const res = await fetch(path, {...options, headers:{...headers, ...(options && options.headers)}});
  const data = await res.json().catch(() => null);
  if (!res.ok || !data || data.ok === false){
    const msg = (data && data.error) ? data.error : ("HTTP " + res.status);
    throw new Error(msg);
  }
  return data;
}

async function loadLibrary(){
  const data = await apiRequest("/api/links");
  state.items = (data.items || []).map(it => ({
    id: it.id || "", type: it.type || "url", target: it.target || "", title: it.title || "",
    alias: it.alias || "", tags: it.tags || "", emoji: it.emoji || "", color: it.color || "",
    iconKind: it.iconKind || "auto", folder: normalizeFolder(it.folder), iconSrc: it.iconSrc || "",
  }));
  state.folders = (data.folders || []).map(normalizeFolder).filter(Boolean);
  ensureFolderChain(ROOT); ensureFolderChain(COMMON);
  state.items.forEach(it => ensureFolderChain(it.folder));
  sortFolders();
  state.selectedFolder = ROOT; state.selectedIds.clear(); state.editingId = null;
  state.dirty = false;
  renderAll();
}

function sortFolders(){
  // 保证 ROOT 第一、COMMON 第二，其余保持提交顺序
  const rest = state.folders.filter(f => f !== ROOT && f !== COMMON);
  state.folders = [ROOT, COMMON, ...rest];
}

async function save(){
  if (state.saving) return;
  state.saving = true; renderStatus();
  try {
    const folders = [];
    state.folders.forEach(f => {
      const name = normalizeFolder(f);
      if (name && !folders.includes(name)) folders.push(name);
    });
    const payload = {
      folders,
      items: state.items.map(it => ({
        id: it.id || null, type: it.type, target: it.target, title: it.title,
        alias: it.alias, tags: it.tags, emoji: it.emoji, color: it.color,
        iconKind: it.iconKind, folder: it.folder, iconSrc: it.iconSrc,
      })),
    };
    const data = await apiRequest("/api/links", { method:"POST", body: JSON.stringify(payload) });
    await loadLibrary();
    toast("已保存 " + (data.saved || state.items.length) + " 条到插件");
  } catch (err){
    toast("保存失败：" + err.message);
  } finally {
    state.saving = false; renderStatus();
  }
}

/* ---------- 交互 ---------- */
function selectItem(id){
  state.editingId = id;
  renderAll();
}
function setFolder(item, folder){
  if (!item) return;
  item.folder = folder; state.dirty = true; renderAll();
}
function moveFolder(path, delta){
  const kids = rootChildren();
  const idx = kids.indexOf(path);
  const targetIdx = idx + delta;
  if (idx <= 0 || targetIdx < 1 || targetIdx >= kids.length) return;
  const a = path, b = kids[targetIdx];
  const ai = state.folders.indexOf(a), bi = state.folders.indexOf(b);
  state.folders[ai] = b; state.folders[bi] = a;
  // 只交换文件夹的显示顺序，条目归属保持不变。
  state.folderOrderDirty = true; state.dirty = true; renderAll();
}

function openModal(title, desc, bodyNode, actions){
  const modal = $("modal"); modal.textContent = "";
  modal.append(el("h3","",title));
  if (desc) modal.append(el("p","",desc));
  if (bodyNode){ const b = el("div","m-body"); b.append(bodyNode); modal.append(b); }
  const bar = el("div","m-actions");
  actions.forEach(a => {
    const btn = el("button", "btn" + (a.primary ? " primary" : "") + (a.danger ? " danger" : ""), a.label);
    btn.onclick = a.onClick;
    bar.append(btn);
  });
  modal.append(bar);
  $("modal-root").classList.add("on");
}
function closeModal(){ $("modal-root").classList.remove("on"); }

function openNewFolder(){
  const input = el("input",""); input.placeholder = "例如「工作」「学习」";
  const loc = el("select");
  const options = [];
  if (state.selectedFolder && state.selectedFolder !== ROOT){
    options.push(["current", "当前文件夹（" + folderName(state.selectedFolder) + "）内"]);
  }
  options.push(["root","「网页链接」内"],["top","顶层（网页链接 外）"]);
  options.forEach(([v,t]) => { const o = el("option","",t); o.value = v; loc.append(o); });
  const topLevelSelected = state.selectedFolder && state.selectedFolder !== ROOT && !isUnder(state.selectedFolder, ROOT);
  loc.value = options.some(([v]) => v === "current") ? "current" : (topLevelSelected ? "top" : "root");

  const wrap = el("div");
  wrap.style.display = "grid"; wrap.style.gap = "8px";
  [input, loc].forEach(node => {
    node.style.width = "100%"; node.style.border = "1px solid var(--line-strong)";
    node.style.borderRadius = "8px"; node.style.padding = "7px 9px"; node.style.background = "var(--surface-2)";
    wrap.append(node);
  });
  wrap.append(el("span","hint","位置可选当前文件夹、网页链接内或顶层；名称含 / 时按完整路径创建。"));

  openModal("新建文件夹", "可建在当前文件夹、网页链接内或顶层（网页链接 外）。", wrap, [
    { label:"取消", onClick: closeModal },
    { label:"创建", primary:true, onClick: () => {
      const name = normalizeFolder(input.value);
      const error = folderValidationError(name);
      if (error){ toast(error); return; }
      let path;
      if (loc.value === "current" && state.selectedFolder){
        path = name === state.selectedFolder || name.startsWith(state.selectedFolder + "/")
          ? name
          : state.selectedFolder + "/" + name;
      } else if (loc.value === "top" || name === ROOT || name.startsWith(ROOT + "/")){
        path = name;
      } else {
        path = ROOT + "/" + name;
      }
      if (path.length > 256){ toast("文件夹总长度不能超过 256 个字符"); return; }
      if (path === ROOT){ toast("「网页链接」已存在"); return; }
      if (path === COMMON){ toast("「常用」已存在"); return; }
      if (state.folders.some(f => f.toLowerCase() === path.toLowerCase())){ toast("文件夹已存在"); return; }
      ensureFolderChain(path);
      sortFolders();
      state.dirty = true; closeModal(); renderAll(); toast("已创建「" + path + "」，保存后生效");
    }},
  ]);
  setTimeout(() => input.focus(), 50);
}
function openRenameFolder(path){
  const input = el("input"); input.value = folderName(path);
  input.style.width = "100%"; input.style.border = "1px solid var(--line-strong)";
  input.style.borderRadius = "8px"; input.style.padding = "7px 9px"; input.style.background = "var(--surface-2)";
  openModal("重命名文件夹", "条目会跟随文件夹一起改名。", input, [
    { label:"取消", onClick: closeModal },
    { label:"保存", primary:true, onClick: () => {
      const name = normalizeFolder(input.value);
      const error = folderValidationError(name);
      if (error){ toast(error); return; }
      if (path === ROOT){ toast("「网页链接」不可重命名"); return; }
      if (name.includes("/")){ toast("名称不能包含 /"); return; }
      const parent = parentPath(path);
      const newPath = parent ? parent + "/" + name : name;
      if (newPath.length > 256){ toast("文件夹总长度不能超过 256 个字符"); return; }
      if (state.folders.some(f => f.toLowerCase() !== path.toLowerCase() && f.toLowerCase() === newPath.toLowerCase())){ toast("同名文件夹已存在"); return; }
      state.folders = state.folders.map(f => f === path ? newPath : (f.startsWith(path + "/") ? newPath + f.slice(path.length) : f));
      state.items.forEach(it => {
        if (it.folder === path) it.folder = newPath;
        else if (it.folder.startsWith(path + "/")) it.folder = newPath + it.folder.slice(path.length);
      });
      if (state.selectedFolder === path) state.selectedFolder = newPath;
      state.dirty = true; closeModal(); renderAll(); toast("已重命名，保存后生效");
    }},
  ]);
  setTimeout(() => { input.focus(); input.select(); }, 50);
}
function openDeleteFolder(path){
  if (path === ROOT){ toast("「网页链接」不可删除"); return; }
  if (childFolders(path).length > 0){ toast("该文件夹含子文件夹，请先删除子文件夹"); return; }
  const affected = countInTree(path);
  const destination = path.startsWith(ROOT + "/") ? COMMON : "";
  const destText = destination ? "「常用」" : "未分类（网页链接 外）";
  openModal("删除文件夹", "「" + folderName(path) + "」中的 " + affected + " 条条目会移动到" + destText + "，条目不会被删除。",
    null, [
      { label:"取消", onClick: closeModal },
      { label:"确认删除", danger:true, onClick: () => {
        state.items.forEach(it => {
          if (isUnder(it.folder, path)) it.folder = destination;
        });
        state.folders = state.folders.filter(f => !isUnder(f, path));
        if (state.selectedFolder === path) state.selectedFolder = destination;
        state.dirty = true; closeModal(); renderAll(); toast("已删除，条目已移到" + destText + "，保存后生效");
      }},
    ]);
}

function bind(){
  $("search").addEventListener("input", e => {
    state.query = e.target.value;
    // 搜索会隐藏部分条目；清掉选择，避免批量操作作用到看不见的行。
    state.selectedIds.clear();
    renderList();
  });
  $("btn-new-folder").onclick = openNewFolder;
  $("btn-save").onclick = save;
  $("btn-export-json").onclick = exportJson;
  $("btn-import-json").onclick = () => {
    const input = el("input"); input.type = "file"; input.accept = ".json,application/json";
    input.onchange = () => { if (input.files && input.files[0]) importJsonFile(input.files[0]); };
    input.click();
  };
  const newItem = () => {
    // 临时 id 只用于前端定位；加序号避免同一毫秒连续新建两条时撞 id。
    const id = "new-" + Date.now() + "-" + (++state.newIdSeq);
    state.items.unshift({ id, type:"url", target:"", title:"", alias:"", tags:"", emoji:"", color:"",
      iconKind:"auto", folder: state.selectedFolder === ROOT ? COMMON : state.selectedFolder, iconSrc:"" });
    state.editingId = id; state.dirty = true; renderAll(); toast("新条目已加入列表，填写后点保存");
  };
  $("btn-new-item").onclick = newItem;
  $("btn-new-item-empty").onclick = newItem;
  $("btn-apply").onclick = () => {
    const item = state.items.find(x => x.id === state.editingId);
    if (!item) return;
    if (!String(item.target || "").trim()){ toast("目标不能为空"); return; }
    if (!item.title) item.title = item.target;
    ensureFolderChain(item.folder);
    state.dirty = true; renderAll(); toast("已应用到列表");
  };
  $("btn-delete-item").onclick = () => {
    const item = state.items.find(x => x.id === state.editingId);
    if (!item) return;
    openModal("删除条目", "「" + (item.title || item.target) + "」将从列表中移除，保存后生效。", null, [
      { label:"取消", onClick: closeModal },
      { label:"删除", danger:true, onClick: () => {
        state.items = state.items.filter(x => x.id !== item.id);
        state.selectedIds.delete(item.id);
        state.editingId = null; state.dirty = true; closeModal(); renderAll();
      }},
    ]);
  };
  $("bulk-clear").onclick = () => { state.selectedIds.clear(); renderAll(); };
  $("bulk-move").onclick = () => {
    const target = $("bulk-target").value;
    state.items.forEach(it => { if (state.selectedIds.has(it.id)) it.folder = target; });
    state.selectedIds.clear(); state.dirty = true; renderAll(); toast("已移动，保存后生效");
  };
  $("bulk-common").onclick = () => {
    state.items.forEach(it => { if (state.selectedIds.has(it.id)) it.folder = COMMON; });
    state.selectedIds.clear(); state.dirty = true; renderAll(); toast("已设为常用，保存后生效");
  };
  $("modal-root").addEventListener("click", e => { if (e.target === $("modal-root")) closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
  window.addEventListener("beforeunload", e => { if (state.dirty){ e.preventDefault(); e.returnValue = ""; } });
}

/* ---------- 启动 ---------- */
(function init(){
  const params = new URLSearchParams(location.search);
  const token = params.get("token") || sessionStorage.getItem("cmdpal-links-token") || "";
  if (token){ sessionStorage.setItem("cmdpal-links-token", token); params.delete("token");
    const qs = params.toString(); history.replaceState(null, "", location.pathname + (qs ? "?" + qs : "")); }
  state.token = token;
  bind();
  if (!token){
    $("btn-save").disabled = true;
    toast("缺少访问令牌：请从插件的「批量编辑」打开");
    return;
  }
  loadLibrary().catch(err => toast("读取失败：" + err.message));
})();
</script>
